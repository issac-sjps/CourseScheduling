<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02．教師管理</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="data.js"></script><style>body{margin:0;background:#f1f5f9;font-family:system-ui,"Noto Sans TC";color:#172033}.bar{background:#172033;color:white;padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar a{color:#dbeafe;text-decoration:none;padding:7px 10px;border-radius:6px}.bar a.active,.bar a:hover{background:#fbbf24;color:#172033}.wrap{max-width:1200px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 1px 4px #0002}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.save{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}.status{margin-left:auto;color:#475569;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:7px;border:1px solid #cbd5e1;text-align:left}th{background:#e2e8f0}input,select{box-sizing:border-box;width:100%;padding:5px;border:1px solid #94a3b8;border-radius:4px}</style></head><body><nav class="bar"><strong>🏫 排課前設定</strong><a href="setup-subjects.html">01 節數設定</a><a class="active" href="setup-teachers.html">02 教師管理</a><a href="setup-assignments.html">03 配課設定</a><a href="scheduler.html">電腦排課</a><a href="reports.html">統計與列印</a></nav><main class="wrap"><section class="card"><h1>02．教師管理</h1><p>一次只呈現一種角色，避免全校教師的所有輸入欄位同時渲染。</p><div class="tools"><label>角色 <select id="role"><option>主任</option><option>組長</option><option selected>科任</option><option>導師</option></select></label><input id="search" placeholder="搜尋姓名" style="max-width:190px"><button class="save" id="save">儲存教師資料</button><span id="status" class="status">載入中…</span></div><table><thead><tr><th>姓名</th><th>角色</th><th>班級</th><th>基本節數</th><th>減授</th><th>超鐘點</th><th>權重</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore(),col=db.collection(FS_COLLECTIONS.teachers),$=id=>document.getElementById(id);let teachers=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await col.get();teachers=s.docs.map(d=>({id:+d.id,...d.data()})).sort((a,b)=>a.id-b.id);render();$('status').textContent='已載入（尚未儲存）'}function render(){const role=$('role').value,q=$('search').value.trim();const shown=teachers.filter(t=>t.role===role&&(!q||t.name.includes(q)));$('rows').innerHTML=shown.map(t=>`<tr data-id="${t.id}"><td><input data-k="name" value="${esc(t.name)}"></td><td>${esc(t.role)}</td><td><input data-k="classId" value="${esc(t.classId)}"></td><td><input data-k="baseLoad" type="number" value="${t.baseLoad||0}"></td><td><input data-k="reduction" type="number" value="${t.reduction||0}"></td><td><input data-k="overtime" type="number" value="${t.overtime||0}"></td><td><input data-k="priority" type="number" value="${t.priority||10}"></td></tr>`).join('')||'<tr><td colspan="7">沒有符合的教師</td></tr>'}$('role').onchange=render;$('search').oninput=render;$('save').onclick=async()=>{document.querySelectorAll('#rows tr[data-id]').forEach(r=>{const t=teachers.find(x=>x.id==r.dataset.id);r.querySelectorAll('[data-k]').forEach(i=>t[i.dataset.k]=['baseLoad','reduction','overtime','priority'].includes(i.dataset.k)?(+i.value||0):i.value)});$('status').textContent='儲存中…';const b=db.batch();teachers.forEach(t=>b.set(col.doc(String(t.id)),t));await b.commit();$('status').textContent='✓ 已儲存'};load().catch(e=>$('status').textContent='載入失敗：'+e.message);</script></body></html>
