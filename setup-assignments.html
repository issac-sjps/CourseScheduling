<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03．配課設定</title><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script><script src="data.js"></script><style>body{margin:0;background:#f1f5f9;font-family:system-ui,"Noto Sans TC";color:#172033}.bar{background:#172033;color:white;padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar a{color:#dbeafe;text-decoration:none;padding:7px 10px;border-radius:6px}.bar a.active,.bar a:hover{background:#fbbf24;color:#172033}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 1px 4px #0002}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.save{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}.status{margin-left:auto;color:#475569;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:8px;border:1px solid #cbd5e1;text-align:left}th{background:#e2e8f0}select{width:100%;padding:6px;border:1px solid #94a3b8;border-radius:4px}</style></head><body><nav class="bar"><strong>🏫 排課前設定</strong><a href="setup-subjects.html">01 節數設定</a><a href="setup-teachers.html">02 教師管理</a><a class="active" href="setup-assignments.html">03 配課設定</a><a href="scheduler.html">電腦排課</a><a href="reports.html">統計與列印</a></nav><main class="wrap"><section class="card"><h1>03．配課設定</h1><p>只載入並繪製目前選擇班級的科目配課，不再一次建立全校下拉選單。</p><div class="tools"><label>班級 <select id="class"></select></label><button class="save" id="save">儲存本班配課</button><span id="status" class="status">載入中…</span></div><table><thead><tr><th>科目</th><th>節數</th><th>授課教師</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore(),$=id=>document.getElementById(id);let config={},teachers=[],cid='';const cfg=db.collection(FS_COLLECTIONS.config).doc(FS_CONFIG_DOC),assign=db.collection(FS_COLLECTIONS.assignments);async function load(){const[a,b]=await Promise.all([cfg.get(),db.collection(FS_COLLECTIONS.teachers).get()]);config=a.exists?a.data():{};teachers=b.docs.map(d=>({id:+d.id,...d.data()}));const gc=config.gradeConfig||DEFAULT_GRADE_CLASS_COUNT;for(let g=1;g<=6;g++)for(let c=1;c<=(gc[g]||0);c++)$('class').add(new Option(`${g}${String(c).padStart(2,'0')} 班`,`${g}${String(c).padStart(2,'0')}`));cid=$('class').value;$('class').onchange=()=>{cid=$('class').value;render()};await render();$('status').textContent='已載入（尚未儲存）'}async function render(){const snap=await assign.doc(cid).get(),data=snap.exists?snap.data().assignments||{}:{},g=+cid[0],matrix=(config.gradeSubjectConfig||DEFAULT_GRADE_MATRIX)[g]||{};const opts='<option value="">— 導師／未指定 —</option>'+teachers.map(t=>`<option value="${t.id}">${t.name}（${t.role}）</option>`).join('');$('rows').innerHTML=SUBJECTS.filter(s=>(matrix[s.zh]||0)>0).map(s=>{const a=data[s.zh]||{};return `<tr><td>${s.zh}</td><td>${matrix[s.zh]||0}</td><td><select data-subject="${s.zh}">${opts}</select></td></tr>`}).join('');document.querySelectorAll('[data-subject]').forEach(el=>el.value=data[el.dataset.subject]?.primary||'')}$('save').onclick=async()=>{const data={};document.querySelectorAll('[data-subject]').forEach(el=>{if(el.value)data[el.dataset.subject]={primary:+el.value,secondary:null,override:null}});$('status').textContent='儲存中…';await assign.doc(cid).set({assignments:data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});$('status').textContent='✓ 已儲存'};load().catch(e=>$('status').textContent='載入失敗：'+e.message);</script></body></html>
